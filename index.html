<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Notes Manager</title>
    
</head>
<body>

<style>
/* Root Variables for Light & Dark Mode */
:root {
    --bg-color: #f4f7f6;
    --container-bg: #ffffff;
    --text-color: #333333;
    --input-border: #cccccc;
    --note-bg: #fff9db;
    --note-border: #ffd43b;
    --primary-color: #5c67f2;
    --primary-hover: #4a54e1;
}

[data-theme="dark"] {
    --bg-color: #1a1a1a;
    --container-bg: #2d2d2d;
    --text-color: #f5f5f5;
    --input-border: #444444;
    --note-bg: #3e3b2e;
    --note-border: #f1c40f;
    --primary-color: #707bfb;
    --primary-hover: #5c67f2;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    transition: background-color 0.3s, color 0.3s;
}

body {
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 50px 20px;
    min-height: 100vh;
}

.theme-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: var(--container-bg);
    color: var(--text-color);
    border: 1px solid var(--input-border);
    padding: 8px 15px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
}

.container {
    width: 100%;
    max-width: 600px;
    background: var(--container-bg);
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    margin-top: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.note-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 30px;
}

input[type="text"], textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--input-border);
    background: var(--container-bg);
    color: var(--text-color);
    border-radius: 6px;
    font-size: 16px;
}

textarea {
    height: 100px;
    resize: none;
}

input:focus, textarea:focus {
    outline: none;
    border-color: var(--primary-color);
}

#add-btn {
    background-color: var(--primary-color);
    color: white;
    border: none;
    padding: 12px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

#add-btn:hover {
    background-color: var(--primary-hover);
}

.notes-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.note-card {
    background: var(--note-bg);
    padding: 15px;
    border-left: 5px solid var(--note-border);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.note-card h3 {
    margin-bottom: 5px;
    word-break: break-word;
}

.note-card p {
    word-break: break-word;
    white-space: pre-wrap;
    font-size: 15px;
}

.card-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.edit-btn {
    background: #2ecc71;
    color: white;
    border: none;
    padding: 6px 12px;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
}

.edit-btn:hover {
    background: #27ae60;
}

.delete-btn {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 6px 12px;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
}

.delete-btn:hover {
    background: #c0392b;
}




</style>
    <!-- Dark Mode Toggle Button -->
    <button id="theme-toggle" class="theme-btn">🌙 Dark Mode</button>

    <div class="container">
        <h1>📝 Notes Manager Pro</h1>
        
        <!-- Note Input Form -->
        <div class="note-form">
            <input type="text" id="note-title" placeholder="Note ka Title...">
            <textarea id="note-input" placeholder="Apna note yahan likhein..."></textarea>
            <button id="add-btn">Add Note</button>
        </div>

        <!-- Notes List Container -->
        <div id="notes-container" class="notes-container"></div>
    </div>

    <script>

const noteTitle = document.getElementById('note-title');
const noteInput = document.getElementById('note-input');
const addBtn = document.getElementById('add-btn');
const notesContainer = document.getElementById('notes-container');
const themeToggle = document.getElementById('theme-toggle');

let notes = JSON.parse(localStorage.getItem('pro_notes')) || [];
let editIndex = null; // Track karne ke liye ki kaunsa note edit ho raha hai

// --- Theme (Dark/Light Mode) Logic ---
let currentTheme = localStorage.getItem('theme') || 'light';
document.documentElement.setAttribute('data-theme', currentTheme);
updateThemeButtonText();

themeToggle.addEventListener('click', () => {
    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);
    localStorage.setItem('theme', currentTheme);
    updateThemeButtonText();
});

function updateThemeButtonText() {
    themeToggle.textContent = currentTheme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
}

// --- Notes Management Logic ---

// Screen par notes dikhane ka function
function displayNotes() {
    notesContainer.innerHTML = '';
    
    if (notes.length === 0) {
        notesContainer.innerHTML = '<p style="text-align:center; color:#aaa;">Koi bhi note nahi hai!</p>';
        return;
    }

    notes.forEach((note, index) => {
        const noteCard = document.createElement('div');
        noteCard.classList.add('note-card');

        // Agar title khali hai toh default title set karein
        const titleText = note.title ? note.title : `Note #${index + 1}`;

        noteCard.innerHTML = `
            <h3>${titleText}</h3>
            <p>${note.text}</p>
            <div class="card-actions">
                <button class="edit-btn" onclick="editNote(${index})">Edit</button>
                <button class="delete-btn" onclick="deleteNote(${index})">Delete</button>
            </div>
        `;

        notesContainer.appendChild(noteCard);
    });
}

// Note Add ya Update karne ka function
function saveNote() {
    const titleValue = noteTitle.value.trim();
    const textValue = noteInput.value.trim();
    
    if (textValue === '') {
        alert('Kripya note ka main content likhein!');
        return;
    }

    const noteData = {
        title: titleValue,
        text: textValue
    };

    if (editIndex !== null) {
        // Agar edit chal raha hai toh purane note ko update karein
        notes[editIndex] = noteData;
        editIndex = null;
        addBtn.textContent = 'Add Note';
    } else {
        // Naya note add karein
        notes.push(noteData);
    }

    localStorage.setItem('pro_notes', JSON.stringify(notes));
    
    // Inputs clear karein
    noteTitle.value = '';
    noteInput.value = '';
    
    displayNotes();
}

// Note ko edit mode mein daalne ka function
function editNote(index) {
    noteTitle.value = notes[index].title;
    noteInput.value = notes[index].text;
    
    editIndex = index;
    addBtn.textContent = 'Update Note'; // Button ka text change karein
    window.scrollTo({ top: 0, behavior: 'smooth' }); // Form par scroll karein
}

// Note delete karne ka function
function deleteNote(index) {
    if (confirm('Kya aap is note ko delete karna chahte hain?')) {
        notes.splice(index, 1);
        localStorage.setItem('pro_notes', JSON.stringify(notes));
        
        // Agar chalte edit ke beech delete kiya toh reset karein
        if(editIndex === index) {
            editIndex = null;
            addBtn.textContent = 'Add Note';
            noteTitle.value = '';
            noteInput.value = '';
        }
        
        displayNotes();
    }
}

// Event Listener
addBtn.addEventListener('click', saveNote);

// Page load hote hi display karein
displayNotes();



</script>
</body>
</html>
